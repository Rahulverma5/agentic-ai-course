[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-course"
version = "0.1.0"
description = "15-day hands-on agentic AI course: shared notebook helpers + the ShopEase capstone"
requires-python = ">=3.10"

# `pip install -e .` makes both packages importable from any notebook or script.
[tool.setuptools]
packages = ["course_utils", "shopease"]

[tool.setuptools.package-dir]
course_utils = "course_utils"
shopease = "projects/shopease-support-agent/shopease"

[tool.pytest.ini_options]
testpaths = ["projects/shopease-support-agent/tests"]
